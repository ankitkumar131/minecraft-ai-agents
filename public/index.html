<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Minecraft Players</title>
<style>body{font:16px system-ui;background:#111c19;color:#e4eee7;max-width:1000px;margin:2rem auto;padding:0 1rem}h1{color:#a8e5ae}section,article{background:#20302a;border:1px solid #385647;border-radius:12px;padding:1.25rem;margin:1rem 0}label{display:block;margin:.6rem 0}input,textarea,button{font:inherit;padding:.55rem;border-radius:6px}input,textarea{background:#13211b;color:white;border:1px solid #66816c;max-width:100%;box-sizing:border-box}textarea{width:100%}button{cursor:pointer;background:#b4e5a0;border:0;margin:.3rem .3rem .3rem 0}button:hover{background:#d8f5c9}.error{color:#ffaaa4}small{color:#b4c5b9}pre{white-space:pre-wrap}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}</style>
<h1>AI Minecraft Players</h1><p>Create profiles, connect bots, and submit a builder task. Bots stay idle until you send a task; profile goals do not start autonomous work. Your Minecraft world must be open to LAN or hosted on a compatible server.</p>
<section><label>API token (if configured) <input id="token" type="password" autocomplete="off"></label><small>Held in this page only; not saved.</small></section>
<section><h2>Create player</h2><form id="create"><label>Minecraft name <input name="name" required minlength="3" maxlength="16" pattern="[A-Za-z0-9_]+"></label><label>Role <input name="role" value="Builder" required></label><label>Personality <input name="personality" value="Patient and careful"></label><label>Goal <textarea name="goal" required>Build a house</textarea></label><label>Ollama model <input name="model" value="qwen2.5:7b"></label><label><input name="move" type="checkbox" checked> Allow movement</label><label><input name="place" type="checkbox" checked> Allow placing blocks</label><button>Create player</button></form></section>
<h2>Players</h2><p id="message" role="status"></p><div id="cards"></div><script src="/app.js"></script></html>
